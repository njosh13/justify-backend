# Justify — production stack for Dokploy.
#
# Postgres is provided by Dokploy's managed databases — point DB_* in your .env
# at that service. One image runs three roles: web, queue worker and scheduler.

services:
    web:
        build: .
        restart: unless-stopped
        env_file:
            - .env
        environment:
            # ServerSideUp Laravel automations — web only, so the worker/scheduler
            # containers never race on migrations.
            AUTORUN_ENABLED: "true"
            AUTORUN_LARAVEL_MIGRATION: "true"
            AUTORUN_LARAVEL_CONFIG_CACHE: "true"
            AUTORUN_LARAVEL_ROUTE_CACHE: "true"
            AUTORUN_LARAVEL_VIEW_CACHE: "true"
            AUTORUN_LARAVEL_EVENT_CACHE: "true"
            AUTORUN_LARAVEL_STORAGE_LINK: "true"
            # No Node runtime in the image — render client-side.
            INERTIA_SSR_ENABLED: "false"
        volumes:
            - app_storage:/var/www/html/storage
        ports:
            - 8080
        networks:
            - dokploy-network
            - default
        # web comes up first and populates the shared "storage" volume, so the workers
        # (which wait for it) never race Docker's volume initialization.
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 60s

    # Queue worker (database queue). Uncomment if you dispatch queued jobs/mail.
    # worker:
    #     build: .
    #     restart: unless-stopped
    #     command: php artisan queue:work --sleep=3 --tries=3 --backoff=30 --max-time=3600
    #     env_file:
    #         - .env
    #     volumes:
    #         - app_storage:/var/www/html/storage
    #     depends_on:
    #         web:
    #             condition: service_healthy
    #     networks:
    #         - dokploy-network
    #         - default

    scheduler:
        build: .
        restart: unless-stopped
        command: php artisan schedule:work
        env_file:
            - .env
        volumes:
            - app_storage:/var/www/html/storage
        depends_on:
            web:
                condition: service_healthy
        networks:
            - dokploy-network
            - default

volumes:
    app_storage:

networks:
    dokploy-network:
        external: true
