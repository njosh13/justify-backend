# Interpretations register (plan §6) — places where the published text is
# ambiguous or self-contradictory. Cited on bills that depend on them.

interpretations:
  - code: I-1
    rule_reference: "Sch 6 & 7 item 1(a)–(c)"
    question: "\"(a) … no appearance entered … 65% of the fees chargeable under item 1(a)\" is self-referential as published."
    decision: "(a)/(b)/(c) are percentage multipliers on the tables that follow: 65% applies to the undefended table; 75% and 85% apply to the defended table."
    rationale: "The tables are labelled (a) undefended and (b) defended; the multipliers only make sense as reductions of those. Matches prevailing practice."
    status: adopted

  - code: I-2
    rule_reference: "Sch 2 para 1(b),(c) vs Note 4"
    question: "(b) and (c) say \"the fee prescribed in (a) plus\"; Note 4 says \"It shall not be cumulative\" and \"percentage rate of the band within which the consideration lies\"."
    decision: "Cumulative (tiered)."
    rationale: "The non-cumulative reading gives a rent of 1,000,000 a fee of 30,000 (3%) — lower than a rent of 500,000 (75,000). A scale that falls as the basis rises cannot be intended."
    status: adopted

  - code: I-3
    rule_reference: "Sch 2 para 1(c)"
    question: "\"(c) … the fee prescribed in (a) plus 1% on the excess\" skips (b)."
    decision: "Fee at 3,000,000 under (b) plus 1% of the excess over 3,000,000."
    rationale: "Literal reading produces a cliff (4,000,000 → 85,000 vs 3,000,000 → 150,000)."
    status: adopted

  - code: I-4
    rule_reference: "Sch 1 rule 26(1)"
    question: "Rules 27–41 \"applied in sequence\" — order of stacked reductions."
    decision: "Modifiers execute in paragraph order (sort_order): reductions before floors, floors before caps."
    rationale: "Follows the text; produces the smaller of two reductions only where the Order says so (printed-form cap)."
    status: adopted

  - code: I-5
    rule_reference: "para 7"
    question: "Simple or compound interest; day count."
    decision: "Simple, actual/365."
    rationale: "Order silent; Kenyan courts apply simple interest absent agreement."
    status: adopted

  - code: I-6
    rule_reference: "Sch 6 para 2"
    question: "\"not less than one-third of the instruction fee allowed on taxation\" — party-and-party or advocate-and-client base."
    decision: "One-third of the party-and-party instruction fee, then the Part B 50% uplift applies to the total."
    rationale: "Part B says \"the fees prescribed in A above, increased by 50%\" — the uplift is applied once, to the whole."
    status: adopted

  - code: I-7
    rule_reference: "Rounding"
    question: "Order figures are whole shillings; percentages produce cents."
    decision: "Compute in cents; round each bill line HALF_UP to the shilling; totals are sums of rounded lines."
    rationale: "Avoids penny drift between preview and bill. Firm-configurable."
    status: adopted

  - code: I-8
    rule_reference: "Sch 5 Part I hourly vs para 3"
    question: "Does an agreed hourly rate escape the schedule minimum?"
    decision: "No. Hourly billing is permitted, but the total charged for a matter to which another schedule applies may not fall below that schedule's fee unless a para 22 election is made in writing."
    rationale: "Para 3 is absolute; para 22(2) confirms election cannot reduce below scale."
    status: adopted

  - code: I-9
    rule_reference: "Sch 10 item 1(a)"
    question: "The fee column for gross estate ≤ 1,000,000 (four brackets: ≤10,000; 10,000–50,000; 50,000–200,000; 200,000–1,000,000) is blank in both the Kenya Law PDF and web text."
    decision: "Seed the (0–1M] band as 5% provisionally; replace with the fixed brackets once transcribed from the original enactment / Gazette supplement."
    rationale: "The >1M rule is explicit: 5% of the first 1,000,000 plus 1% of the excess. The provisional 5% band keeps the >1M computation exact while flagging small estates."
    status: proposed

  - code: I-10
    rule_reference: "Sch 10 item 1(g)"
    question: "Literal \"Kshs 2,103 per Kshs 20,000 of net estate × number of entries\" yields 210,300 for a 400,000 estate with 5 entries; the plan's worked case expects 52,575 (= 25 × 2,103)."
    decision: "Seed the literal reading; reconcile the worked case against taxing-officer practice before relying on this head."
    rationale: "52,575 would result from e.g. 2,103 per 80,000 of net estate per entry, or (estate-units + entries) — neither matches the published words. Needs verification against the original enactment."
    status: proposed

  - code: I-11
    rule_reference: "Sch 7 item 1(a)–(c) vs the lower/higher scale table"
    question: "Sch 7's posture multipliers cite \"item 1(a)\" and \"item 1(b)\", but Sch 7's table is split by lower/higher scale, not by undefended/defended."
    decision: "65% attaches to the lower scale (no defence filed); 75% and 85% attach to the higher scale (defence filed)."
    rationale: "The Note to item 1 ties the lower scale to \"no defence or other denial of liability\" — the same condition that defines Sch 6's undefended table (a). The multipliers were copied from Sch 6 by L.N. 45/2014 and carry the same pairing."
    status: adopted

  - code: I-12
    rule_reference: "Sch 10 Part B"
    question: "Part B reads \"In contested matter under the law, the fees as between advocate and client shall be … increased by 50%\". Does the uplift reach uncontested probate work billed advocate-and-client?"
    decision: "No. The uplift applies only where the matter is contested. Heads contested by nature always uplift; uncontested heads never do; neutral heads (drawing, perusing, letters, attendances, inventory) uplift only when the matter is flagged contested."
    rationale: "Every other schedule's Part B opens \"As between advocate and client the minimum fee shall be\"; Sch 10 alone qualifies it with \"in contested matter\". The qualification must be given effect."
    status: adopted
