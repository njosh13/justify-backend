# Schedule 6 — High Court. Part A party-and-party below; Part B = A × 1.5
# applied via applies_cost_basis: contentious. Posture multipliers and
# certificates attach to is_instruction_fee items.

items:
  - code: S6.INSTR.UNDEFENDED
    schedule: 6
    label: "Instruction fee — suits for recovery of money/land, undefended table"
    rule_reference: "Sch 6, item 1(a)"
    basis_type: sum_sued
    computation: tiered
    is_instruction_fee: true
    applies_cost_basis: contentious
    bands:
      - { lower: 0,          upper: 500_000,    fixed: 45_000 }
      - { lower: 500_000,    upper: 750_000,    fixed: 65_000 }
      - { lower: 750_000,    upper: 1_000_000,  fixed: 75_000 }
      - { lower: 1_000_000,  upper: 20_000_000, rate: "0.0175" }
      - { lower: 20_000_000, upper: null,       rate: "0.015" }

  - code: S6.INSTR.DEFENDED
    schedule: 6
    label: "Instruction fee — suits for recovery of money/land, defended table"
    rule_reference: "Sch 6, item 1(b)"
    basis_type: sum_sued
    computation: tiered
    is_instruction_fee: true
    applies_cost_basis: contentious
    bands:
      - { lower: 0,          upper: 500_000,    fixed: 75_000 }
      - { lower: 500_000,    upper: 750_000,    fixed: 90_000 }
      - { lower: 750_000,    upper: 1_000_000,  fixed: 120_000 }
      - { lower: 1_000_000,  upper: 20_000_000, rate: "0.02" }
      - { lower: 20_000_000, upper: null,       rate: "0.015" }

  - { code: S6.INSTR.OTHER.UNDEFENDED,        schedule: 6, label: "Instruction fee — other matters, undefended", rule_reference: "Sch 6, Other matters (i)", computation: discretionary_floor, included_amount: 45_000, is_instruction_fee: true, applies_cost_basis: contentious }
  - { code: S6.INSTR.OTHER.DEFENDED,          schedule: 6, label: "Instruction fee — other matters, defended", rule_reference: "Sch 6, Other matters (ii)", computation: discretionary_floor, included_amount: 75_000, is_instruction_fee: true, applies_cost_basis: contentious }
  - { code: S6.INSTR.APPEAL,                  schedule: 6, label: "Instruction fee — appeals", rule_reference: "Sch 6, Appeals (a)", computation: discretionary_floor, included_amount: 25_200, is_instruction_fee: true, applies_cost_basis: contentious }
  - { code: S6.INSTR.ELECTION_PETITION,       schedule: 6, label: "Instruction fee — election petition", rule_reference: "Sch 6, item (i)", computation: discretionary_floor, included_amount: 500_000, is_instruction_fee: true, applies_cost_basis: contentious }
  - { code: S6.INSTR.CONSTITUTIONAL.OPPOSED,  schedule: 6, label: "Instruction fee — constitutional petition, opposed", rule_reference: "Sch 6, item (j)(ii)", computation: discretionary_floor, included_amount: 100_000, is_instruction_fee: true, applies_cost_basis: contentious }
  - { code: S6.INSTR.ARBITRAL_SET_ASIDE,      schedule: 6, label: "Instruction fee — application to set aside arbitral award", rule_reference: "Sch 6, item (j)(iii)", computation: flat, included_amount: 50_000, is_instruction_fee: true, applies_cost_basis: contentious }
  - { code: S6.INSTR.DIVORCE.UNDEFENDED,      schedule: 6, label: "Instruction fee — divorce, undefended", rule_reference: "Sch 6, item (g)(i)", computation: flat, included_amount: 20_000, is_instruction_fee: true, applies_cost_basis: contentious }
  - { code: S6.INSTR.DIVORCE.DEFENDED,        schedule: 6, label: "Instruction fee — divorce, defended", rule_reference: "Sch 6, item (g)(i)", computation: discretionary_floor, included_amount: 35_300, is_instruction_fee: true, applies_cost_basis: contentious }
  - { code: S6.INSTR.WINDING_UP.SUPPORT,      schedule: 6, label: "Instruction fee — supporting winding-up petition", rule_reference: "Sch 6, item (f)(ii)", computation: flat, included_amount: 10_000, is_instruction_fee: true, applies_cost_basis: contentious }
  - { code: S6.INSTR.COMPLEX_CERTIFIED,       schedule: 6, label: "Instruction fee — complex matter certified", rule_reference: "Sch 6, item (c)(vii)", computation: discretionary_floor, included_amount: 100_000, is_instruction_fee: true, applies_cost_basis: contentious }
  - { code: S6.INSTR.APPLICATION.UNOPPOSED,   schedule: 6, label: "Instruction fee — application, unopposed", rule_reference: "Sch 6, item (c)(viii)", computation: flat, included_amount: 3_000, is_instruction_fee: true, applies_cost_basis: contentious }
  - { code: S6.INSTR.APPLICATION.OPPOSED,     schedule: 6, label: "Instruction fee — application, opposed", rule_reference: "Sch 6, item (c)(viii)", computation: discretionary_floor, included_amount: 5_000, is_instruction_fee: true, applies_cost_basis: contentious }

  - code: S6.GETTING_UP
    schedule: 6
    label: "Getting up and preparing case for trial — not less than 1/3 of instruction fee"
    rule_reference: "Sch 6, para 2"
    computation: flat
    included_amount: 0
    applies_cost_basis: contentious
    params: { derived: "third_of_instruction_fee", note: "Computed by the billing layer via GettingUpFee, not standalone" }

  - { code: S6.DRAWING.PLEADING,              schedule: 6, label: "Drawing pleading, plaint, defence, counterclaim, reply, arbitration", rule_reference: "Sch 6, item 4(a)", computation: per_folio, unit_label: folio, units_included: 4, included_amount: 1_100, params: { per_unit: 150 }, applies_cost_basis: contentious }
  - { code: S6.DRAWING.INSOLVENCY_PETITION,   schedule: 6, label: "Drawing insolvency petition or notice of objection", rule_reference: "Sch 6, item 4(b)", computation: per_folio, unit_label: folio, units_included: 6, included_amount: 1_470, params: { per_unit: 150 }, applies_cost_basis: contentious }
  - { code: S6.DRAWING.WINDING_UP_PETITION,   schedule: 6, label: "Drawing winding-up petition (Companies Act)", rule_reference: "Sch 6, item 4(c)", computation: per_folio, unit_label: folio, units_included: 9, included_amount: 2_300, params: { per_unit: 150 }, applies_cost_basis: contentious }
  - { code: S6.DRAWING.OTHER,                 schedule: 6, label: "Drawing all other documents incl. proofs of witnesses", rule_reference: "Sch 6, item 4(d)", computation: per_folio, unit_label: folio, params: { per_unit: 180 }, applies_cost_basis: contentious }
  - { code: S6.DRAWING.BILL_OF_COSTS,         schedule: 6, label: "Drawing bill of costs", rule_reference: "Sch 6, item 4(e)", computation: per_folio, unit_label: folio, params: { per_unit: 180 }, applies_cost_basis: contentious }
  - { code: S6.DRAWING.AFFIDAVIT_OF_SERVICE,  schedule: 6, label: "Affidavit or return of service", rule_reference: "Sch 6, item 4(f)", computation: flat, included_amount: 240, applies_cost_basis: contentious }

  - { code: S6.COPIES,                      schedule: 6, label: "Copies — court, other party, exhibits etc., per folio", rule_reference: "Sch 6, item 5(a),(e)", computation: per_folio, unit_label: folio, params: { per_unit: 25 }, applies_cost_basis: contentious }
  - { code: S6.LETTER,                      schedule: 6, label: "Letters before action or other necessary letters", rule_reference: "Sch 6, item 6", computation: flat, included_amount: 1_000, applies_cost_basis: contentious }
  - { code: S6.LETTER.PER_FOLIO,            schedule: 6, label: "Letters — alternative per folio", rule_reference: "Sch 6, item 6", computation: per_folio, unit_label: folio, params: { per_unit: 118 }, applies_cost_basis: contentious }

  - { code: S6.ATTEND.REGISTRAR,            schedule: 6, label: "Application to or formal attendance on registrar/deputy registrar", rule_reference: "Sch 6, item 7(a)", computation: flat, included_amount: 1_000, applies_cost_basis: contentious }
  - { code: S6.ATTEND.ROUTINE,              schedule: 6, label: "Offices of court or registrar on routine matters", rule_reference: "Sch 6, item 7(b)", computation: flat, included_amount: 500, applies_cost_basis: contentious }
  - { code: S6.ATTEND.LIST_CALLING,         schedule: 6, label: "Court/chambers on hearing date when case not taken, or calling lists", rule_reference: "Sch 6, item 7(c)", computation: flat, included_amount: 1_000, applies_cost_basis: contentious }
  - { code: S6.ATTEND.COURT.HALF_HOUR.LOWER,  schedule: 6, label: "Court/chambers before judge, half-hour or less — ordinary scale", rule_reference: "Sch 6, item 7(d)", computation: flat, included_amount: 1_100, applies_cost_basis: contentious }
  - { code: S6.ATTEND.COURT.HALF_HOUR.HIGHER, schedule: 6, label: "Court/chambers before judge, half-hour or less — higher scale", rule_reference: "Sch 6, item 7(d)", computation: flat, included_amount: 1_900, applies_cost_basis: contentious }
  - { code: S6.ATTEND.COURT.HOUR.LOWER,     schedule: 6, label: "Court/chambers before judge, one hour — ordinary scale", rule_reference: "Sch 6, item 7(d)", computation: flat, included_amount: 2_300, applies_cost_basis: contentious }
  - { code: S6.ATTEND.COURT.HOUR.HIGHER,    schedule: 6, label: "Court/chambers before judge, one hour — higher scale", rule_reference: "Sch 6, item 7(d)", computation: flat, included_amount: 3_000, applies_cost_basis: contentious }
  - { code: S6.ATTEND.COURT.DAY.LOWER,      schedule: 6, label: "Court/chambers before judge, whole day — ordinary scale", rule_reference: "Sch 6, item 7(d)", computation: flat, included_amount: 10_000, applies_cost_basis: contentious }
  - { code: S6.ATTEND.COURT.DAY.HIGHER,     schedule: 6, label: "Court/chambers before judge, whole day — higher scale", rule_reference: "Sch 6, item 7(d)", computation: flat, included_amount: 15_000, applies_cost_basis: contentious }

  - { code: S6.PERUSAL,                     schedule: 6, label: "Perusing pleadings, appeals, affidavits, motions etc., per folio", rule_reference: "Sch 6, item 8(a)", computation: per_folio, unit_label: folio, params: { per_unit: 50 }, applies_cost_basis: contentious }
  - { code: S6.PERUSAL.ROUTINE,             schedule: 6, label: "Perusing notices and other routine documents", rule_reference: "Sch 6, item 8(b)", computation: flat, included_amount: 50, applies_cost_basis: contentious }
  - { code: S6.PERUSAL.LETTER,              schedule: 6, label: "Perusing necessary letter, per folio", rule_reference: "Sch 6, item 8(c)", computation: per_folio, unit_label: folio, params: { per_unit: 50 }, applies_cost_basis: contentious }

  - { code: S6.SERVICE.LOCAL,               schedule: 6, label: "Service within 3 km of High Court or district registry", rule_reference: "Sch 6, item 9(a)", computation: flat, included_amount: 1_400, applies_cost_basis: contentious }
  - { code: S6.SERVICE.PER_KM,              schedule: 6, label: "Service beyond 3 km — 1,400 for first 3 km + ≤35/km", rule_reference: "Sch 6, item 9(a),(b)", computation: per_unit, unit_label: km, units_included: 3, included_amount: 1_400, params: { per_unit: 35 }, applies_cost_basis: contentious }

  - { code: S6.EXECUTION.INSTRUCTIONS,      schedule: 6, label: "Instructions to execute decree and drawing", rule_reference: "Sch 6, item 12(a)", computation: flat, included_amount: 1_000, applies_cost_basis: contentious }
  - { code: S6.OBJECTION.INSTRUCTIONS,      schedule: 6, label: "Instructions to prepare objection to execution", rule_reference: "Sch 6, item 13(a)", computation: flat, included_amount: 10_000, applies_cost_basis: contentious }
  - { code: S6.GARNISHEE.UNOPPOSED,         schedule: 6, label: "Garnishee proceedings, unopposed", rule_reference: "Sch 6, item 14(a)", computation: flat, included_amount: 4_200, applies_cost_basis: contentious }
  - { code: S6.GARNISHEE.OPPOSED,           schedule: 6, label: "Garnishee proceedings, opposed", rule_reference: "Sch 6, item 14(b)", computation: discretionary_floor, included_amount: 14_000, applies_cost_basis: contentious }
  - { code: S6.CERT_COSTS.NO_APPEARANCE,    schedule: 6, label: "Certificate of costs — no appearance", rule_reference: "Sch 6, item 15(a)(i)", computation: flat, included_amount: 1_200, applies_cost_basis: contentious }
  - { code: S6.CERT_COSTS.EXTRA_SERVICE,    schedule: 6, label: "Certificate of costs — each additional service attempt", rule_reference: "Sch 6, item 15(a)(ii)", computation: per_unit, unit_label: attempt, params: { per_unit: 250 }, applies_cost_basis: contentious }

modifiers:
  # Payment into court (Sch 6 proviso (v)) — on instruction fees.
  - { code: S6.PAYMENT_IN.LATE_ACCEPTANCE, label: "Payment into court accepted late — instruction fee ×0.75", rule_reference: "Sch 6, proviso (v)", op: multiply, value: "0.75", applies_to: [S6.INSTR.UNDEFENDED, S6.INSTR.DEFENDED], condition_key: payment_in_accepted_late, sort_order: 20 }
  - { code: S6.PAYMENT_IN.NOT_ACCEPTED,    label: "Payment into court not accepted — instruction fee ×0.5", rule_reference: "Sch 6, proviso (v)", op: multiply, value: "0.5", applies_to: [S6.INSTR.UNDEFENDED, S6.INSTR.DEFENDED], condition_key: payment_in_not_accepted, sort_order: 20 }
