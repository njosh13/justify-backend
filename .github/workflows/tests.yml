name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: justify_test
          POSTGRES_USER: justify
          POSTGRES_PASSWORD: justify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U justify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tests run on the same engine as dev/prod (jsonb, numeric); phpunit.xml's
      # sqlite defaults do not override variables already present in the environment.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: justify_test
      DB_USERNAME: justify
      DB_PASSWORD: justify

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, bcmath, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
